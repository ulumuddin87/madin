<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nilai Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h5 id="judul">📘 Input Nilai Murid</h5>
      </div>
      <div class="card-body">
        <form id="formNilai">
          <div class="mb-3">
            <label class="form-label">Semester</label>
            <select id="semester" class="form-select" required>
              <option value="Ganjil">Ganjil</option>
              <option value="Genap">Genap</option>
            </select>
          </div>

          <div id="listMapel" class="row g-3"></div>

          <div class="d-flex justify-content-between mt-4">
            <a href="index.html" class="btn btn-secondary">⬅ Kembali</a>
            <button type="submit" class="btn btn-success" id="btnSubmit">🚀 Simpan Nilai</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // 🔹 Ganti sesuai project kamu
    const SUPABASE_URL = "https://wfscxloykjfiqjhizihh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmc2N4bG95a2pmaXFqaGl6aWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTkyNTAsImV4cCI6MjA3NzgzNTI1MH0.vLBX7NXKVsjyqyVSseLGmrObbGSrzXh-eXbENuKCIx8";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil ID murid dari URL
    const params = new URLSearchParams(window.location.search);
    const muridId = params.get("id");

    const formNilai = document.getElementById("formNilai");
    const listMapel = document.getElementById("listMapel");
    const semesterSelect = document.getElementById("semester");
    const btnSubmit = document.getElementById("btnSubmit");

    // 🔹 Load Mapel & Cek Nilai
    async function loadMapel() {
      const semester = semesterSelect.value;

      // 1️⃣ Ambil semua mapel
      const { data: mapelData, error: mapelError } = await supabase.from("mapel").select("*");
      if (mapelError) return alert("Gagal ambil data mapel: " + mapelError.message);

      // 2️⃣ Cek apakah sudah ada nilai murid di semester ini
      const { data: nilaiData, error: nilaiError } = await supabase
        .from("nilai")
        .select("mapel_id, nilai, deskripsi")
        .eq("murid_id", muridId)
        .eq("semester", semester);

      if (nilaiError) return alert("Gagal cek nilai: " + nilaiError.message);

      // 3️⃣ Jika sudah ada nilai, tampilkan tapi form diblok
      if (nilaiData && nilaiData.length > 0) {
        listMapel.innerHTML = mapelData.map(m => {
          const n = nilaiData.find(x => x.mapel_id === m.id);
          return `
            <div class="col-md-6">
              <label class="form-label">${m.nama}</label>
              <input type="number" class="form-control" value="${n ? n.nilai : ''}" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label">Deskripsi ${m.nama}</label>
              <input type="text" class="form-control" value="${n ? n.deskripsi : ''}" readonly>
            </div>
          `;
        }).join("");

        btnSubmit.disabled = true;
        btnSubmit.innerText = "✅ Nilai semester ini sudah diisi";
        alert("Nilai untuk semester ini sudah diisi. Anda tidak dapat mengubahnya di sini.");
        return;
      }

      // 4️⃣ Kalau belum ada nilai, tampilkan form input
      listMapel.innerHTML = mapelData.map(m => `
        <div class="col-md-6">
          <label class="form-label">${m.nama}</label>
          <input type="number" class="form-control" name="mapel_${m.id}" placeholder="Nilai ${m.nama}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Deskripsi ${m.nama}</label>
          <input type="text" class="form-control" name="deskripsi_${m.id}" placeholder="Deskripsi singkat" required>
        </div>
      `).join("");

      btnSubmit.disabled = false;
      btnSubmit.innerText = "🚀 Simpan Nilai";
    }

    // 🔹 Simpan Nilai
    formNilai.addEventListener("submit", async (e) => {
      e.preventDefault();
      const semester = semesterSelect.value;
      const inputs = new FormData(formNilai);

      const mapelEntries = [];
      for (const [key, value] of inputs.entries()) {
        if (key.startsWith("mapel_")) {
          const id = key.split("_")[1];
          const deskripsi = inputs.get("deskripsi_" + id);
          mapelEntries.push({
            murid_id: muridId,
            mapel_id: id,
            semester,
            nilai: parseInt(value),
            deskripsi
          });
        }
      }

      const { error } = await supabase.from("nilai").insert(mapelEntries);
      if (error) return alert("❌ Gagal simpan nilai: " + error.message);
      alert("✅ Nilai berhasil disimpan!");
      loadMapel(); // refresh agar form diblok setelah simpan
    });

    // 🔹 Reload saat ganti semester
    semesterSelect.addEventListener("change", loadMapel);

    // 🔹 Jalankan awal
    loadMapel();
  </script>
</body>
</html>
