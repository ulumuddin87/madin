<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Murid</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #f8f9fa; }
    .modal-dialog-scrollable .modal-body {
      max-height: 70vh;
      overflow-y: auto;
    }
    
  </style>
</head>
<body>
  <div class="container-fluid px-3 px-md-4">


  <!-- Header & Tombol -->
  <div class="sticky-top bg-white border-bottom mb-3">
  <div class="d-flex justify-content-between align-items-center py-2">
    <h4 class="mb-0">📋 Data Santri Mafatihul Huda</h4>

    <div class="d-flex align-items-center gap-2">
      <span id="userInfo" class="fw-semibold text-primary"></span>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
        Logout
      </button>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 pb-2">
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalForm">
      ➕ Tambah Murid
    </button>
    <button class="btn btn-secondary btn-sm" onclick="window.location.href='mapel.html'">
      📚 Mapel
    </button>
    <button class="btn btn-primary btn-sm">
      🖨 Cetak
    </button>
    <button class="btn btn-warning btn-sm" id="exportExcelBtn">
      📤 Export Excel
    </button>
  </div>
</div>

  <!-- Filter -->
  <div class="card mb-3 shadow-sm">
  <div class="card-body">
    <form id="filterForm" class="row g-2 align-items-end">
      <div class="col-md-4">
        
        <input type="text" id="searchInput" class="form-control" placeholder="Cari nama...">
      </div>
      <div class="col-md-3">
        
        <select id="kelasFilter" class="form-select">
          <option value="">Semua Kelas</option>
        </select>
      </div>
      <div class="col-md-3">
        
        <select id="jilidFilter" class="form-select">
          <option value="">Semua Jilid</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
          🔍 Filter
        </button>
      </div>
    </form>
  </div>
</div>


  <!-- Tabel Data -->
  <div class="table-responsive" style="max-height: 70vh;">
  <table class="table table-bordered table-striped align-middle" id="muridTable">
    <thead class="table-dark text-center sticky-top">
      <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Jilid</th>
        <th>Kelas</th>
        <th>Alamat</th>
        <th>Wali Murid</th>
        <th>Wali Kelas</th>
        <th>Status Nilai</th>
        <th style="width:120px">Aksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>


<!-- Modal Form -->
<div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="modalFormLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <form id="muridForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modalFormLabel">Tambah Murid</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="muridId">

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Nama</label>
              <input type="text" id="nama" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Jilid</label>
              <input type="text" id="jilid" class="form-control">
            </div>
            <div class="col-md-2">
              <label class="form-label">Kelas</label>
              <input type="text" id="kelas" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Alamat</label>
              <input type="text" id="alamat" class="form-control">
            </div>

            <div class="col-md-4">
              <label class="form-label">Wali Murid</label>
              <input type="text" id="wali_murid" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Wali Kelas</label>
              <input type="text" id="wali_kelas" class="form-control">
            </div>

            <!-- Biodata Tambahan -->
            <hr>
            <h5 class="mt-2">🧾 Biodata Lengkap</h5>

            <div class="col-md-4">
              <label class="form-label">NIK</label>
              <input type="number" id="nik" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">No Induk</label>
              <input type="number" id="no_induk" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tempat, Tanggal Lahir</label>
              <input type="text" id="tempat_tanggal_lahir" class="form-control">
            </div>

            <div class="col-md-3">
              <label class="form-label">Jenis Kelamin</label>
              <select id="jenis_kelamin" class="form-select">
                <option value="">- Pilih -</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label">Nilai Bacaan</label>
              <input type="number" id="nilai_bacaan" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Nilai Hafalan</label>
              <input type="number" id="nilai_hafalan" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Nilai Ahlak</label>
              <input type="number" id="nilai_ahlak" class="form-control">
            </div>

            <div class="col-md-3">
              <label class="form-label">Nilai Kehadiran</label>
              <input type="number" id="nilai_kehadiran" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Status dalam Keluarga</label>
              <input type="text" id="status_dalam_keluarga" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Anak ke</label>
              <input type="number" id="anak_ke" class="form-control">
            </div>

            <hr class="mt-3">
            <h5>👨‍👩‍👧 Orang Tua</h5>

            <div class="col-md-4">
              <label class="form-label">Nama Ayah</label>
              <input type="text" id="nama_ayah" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">No Tlp Ayah</label>
              <input type="number" id="no_tlp_ayah" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Pekerjaan Ayah</label>
              <input type="text" id="pekerjaan_ayah" class="form-control">
            </div>

            <div class="col-md-4">
              <label class="form-label">Nama Ibu</label>
              <input type="text" id="nama_ibu" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">No Tlp Ibu</label>
              <input type="number" id="no_tlp_ibu" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Pekerjaan Ibu</label>
              <input type="text" id="pekerjaan_ibu" class="form-control">
            </div>

            <hr class="mt-3">
            <h5>📍 Alamat Detail</h5>

            <div class="col-md-3">
              <label class="form-label">Dusun</label>
              <input type="text" id="dusun" class="form-control">
            </div>
            <div class="col-md-2">
              <label class="form-label">RT</label>
              <input type="number" id="rt" class="form-control">
            </div>
            <div class="col-md-2">
              <label class="form-label">RW</label>
              <input type="number" id="rw" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Desa</label>
              <input type="text" id="desa" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Kecamatan</label>
              <input type="text" id="kecamatan" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Kabupaten/Kota</label>
              <input type="text" id="kabupaten_kota" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Provinsi</label>
              <input type="text" id="provinsi" class="form-control">
            </div>

           

          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Simpan</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Export Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cek login -->
<script type="module">
  const user = JSON.parse(localStorage.getItem("user") || "null");
  if (!user || !user.role) {
    alert("Anda belum login atau role tidak ditemukan. Silakan login ulang.");
    localStorage.removeItem("user");
    window.location.href = "login.html";
  } else {
    console.log(`✅ Selamat datang ${user.nama} (${user.role})`);
    import("./app.js")
      .then(() => console.log("📦 app.js dimuat!"))
      .catch(err => console.error("❌ Gagal muat app.js:", err));
  }
</script>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Cek login
  const userData = JSON.parse(localStorage.getItem("user"));

  if (!userData) {
    alert("Anda belum login. Silakan login terlebih dahulu.");
    window.location.href = "login.html";
  } else if (!userData.role) {
    alert("Role user tidak ditemukan. Silakan login kembali.");
    localStorage.removeItem("user");
    window.location.href = "login.html";
  } else {
    console.log(`✅ Selamat datang ${userData.nama} (${userData.role})`);
    document.getElementById("userInfo").innerText =
      `👋 Halo, ${userData.nama} (${userData.role})`;
  }

  // Tombol logout
  document.getElementById("logoutBtn").addEventListener("click", () => {
    
      localStorage.removeItem("user");
      window.location.href = "login.html";
    
  });
</script>



</div>
</body>
</html>
