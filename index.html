<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Murid</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Style tambahan -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-3">

  <!-- Header & Tombol -->
  <div class="sticky-top bg-white pb-2 pt-2 mb-2 border-bottom">
    <h3 class="mb-2">Data Murid</h3>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-success btn-sm flex-fill" data-bs-toggle="modal" data-bs-target="#modalForm">Tambah Murid</button>
      <button class="btn btn-warning btn-sm flex-fill">Mapel</button>
      <button class="btn btn-primary btn-sm flex-fill">Cetak Semua</button>
    </div>
  </div>

  <!-- Form Pencarian & Filter -->
  <form id="filterForm" class="row g-2 mb-3">
    <div class="col-md-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Cari nama...">
    </div>
    <div class="col-md-3">
      <select id="kelasFilter" class="form-select">
        <option value="">Filter Kelas</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="jilidFilter" class="form-select">
        <option value="">Filter Jilid</option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Cari / Filter</button>
    </div>
  </form>

  <!-- Tabel Data Murid -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle" id="muridTable">
      <thead class="table-dark text-center">
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Jilid</th>
          <th>Kelas</th>
          <th>Alamat</th>
          <th>Wali Murid</th>
          <th>Wali Kelas</th>
          <th>Status Nilai</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal Tambah/Edit Murid -->
<div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="modalFormLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="muridForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modalFormLabel">Tambah Murid</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="muridId">
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Nama</label>
              <input type="text" id="nama" class="form-control" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Jilid</label>
              <input type="text" id="jilid" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Kelas</label>
              <input type="text" id="kelas" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Alamat</label>
              <input type="text" id="alamat" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Wali Murid</label>
              <input type="text" id="wali_murid" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Wali Kelas</label>
              <input type="text" id="wali_kelas" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Simpan</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase SDK (harus sebelum app.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<!-- Script utama -->
<script src="app.js"></script>

</body>
</html>
