<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rapor Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
    h2, h3 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12pt; }
    th, td { border: 1px solid #000; padding: 6px; text-align: center; }
    th { background-color: #e0e0e0; }
    .kategori-title { font-weight: bold; margin-top: 20px; }
    .ttd { display: flex; justify-content: space-between; margin-top: 40px; text-align: center; }
    .ttd div { width: 30%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between mb-3">
      <a href="index.html" class="btn btn-secondary">⬅ Kembali</a>
      <button id="btnPdf" class="btn btn-success">⬇ Download PDF</button>
    </div>

    <h2>TAMAN PENDIDIKAN AL QUR'AN<br>“MAFATIHUL HUDA”</h2>
    <p class="text-center small">Desa Bakalanrayung, Kudu, Jombang | Telp. 0857-3634-0726</p>
    <hr>

   <!-- ====================== -->
<!-- INFO MURID (TAMPIL RAPI) -->
<!-- ====================== -->
<div id="muridInfo" class="mb-4">
  <table class="table table-bordered table-sm align-middle" style="max-width: 700px; margin: 0 auto;">
    <tbody>
      <tr>
        <th class="text-end" style="width: 150px;">Nama</th>
        <td id="muridNama"></td>
        <th class="text-end" style="width: 150px;">NIK</th>
        <td id="muridNIK"></td>
      </tr>
      <tr>
        <th class="text-end">Nomor Induk</th>
        <td id="muridNoInduk"></td>
        <th class="text-end">Kelas</th>
        <td id="muridKelas"></td>
      </tr>
      
    </tbody>
  </table>
</div>

<!-- Container rapot tetap -->
<div id="rapotContainer"></div>

  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://wfscxloykjfiqjhizihh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmc2N4bG95a2pmaXFqaGl6aWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTkyNTAsImV4cCI6MjA3NzgzNTI1MH0.vLBX7NXKVsjyqyVSseLGmrObbGSrzXh-eXbENuKCIx8";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const muridId = params.get("id");

    async function loadRapor() {
      // Ambil data murid
      const { data: murid, error: errMurid } = await supabase.from("murid").select("*").eq("id", muridId).single();
      if (errMurid) return alert("Gagal ambil data murid: " + errMurid.message);

      // Ambil semua nilai murid dari tabel nilai + join mapel
      const { data: nilaiList, error: errNilai } = await supabase
        .from("nilai")
        .select("*, mapel:mapel_id(nama, kategori)")
        .eq("murid_id", muridId)
        .order("semester", { ascending: true });

      if (errNilai) return alert("Gagal ambil nilai: " + errNilai.message);

      // Tampilkan info murid
      document.getElementById("muridNama").textContent = murid.nama;
      document.getElementById("muridNIK").textContent = murid.nik || "-";
      document.getElementById("muridNoInduk").textContent = murid.no_induk || "-";
      document.getElementById("muridKelas").textContent = murid.kelas || "-";
      


      // Kelompokkan per semester
      const bySemester = {};
      nilaiList.forEach(n => {
        if (!bySemester[n.semester]) bySemester[n.semester] = [];
        bySemester[n.semester].push(n);
      });

      let html = "";
      for (const [semester, daftarNilai] of Object.entries(bySemester)) {
        html += `<h3>Semester ${semester}</h3>`;
        const kategoriList = ["BTQ", "Diniyah", "Praktek"];
        kategoriList.forEach(kat => {
          const perKategori = daftarNilai.filter(n => n.mapel?.kategori === kat);
          html += `<div class="kategori-title">${kat}</div>`;
          html += `<table><thead><tr><th>Mata Pelajaran</th><th>Nilai</th><th>Deskripsi</th></tr></thead><tbody>`;
          if (perKategori.length > 0) {
            perKategori.forEach(n => {
              html += `<tr>
                <td>${n.mapel?.nama ?? '-'}</td>
                <td>${n.nilai}</td>
                <td>${n.deskripsi ?? ''}</td>
              </tr>`;
            });
          } else {
            html += `<tr><td colspan="3">Belum ada nilai</td></tr>`;
          }
          html += `</tbody></table>`;
        });

        // Hitung rata-rata semester
        const nilaiAngka = daftarNilai.map(n => n.nilai);
        const rata2 = nilaiAngka.length ? (nilaiAngka.reduce((a, b) => a + b, 0) / nilaiAngka.length).toFixed(2) : 0;
        html += `<p class="text-center fw-bold">Rata-rata Semester ${semester}: ${rata2}</p><hr>`;
      }

      document.getElementById("rapotContainer").innerHTML = html;
    }

    loadRapor();
  </script>
</body>
</html>
