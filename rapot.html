<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rapor Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f8f9fa; }
    h2, h3 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12pt; }
    th, td { border: 1px solid #000; padding: 6px; text-align: center; }
    th { background-color: #e0e0e0; }
    .kategori-title { font-weight: bold; margin-top: 20px; }
    .ttd { display: flex; justify-content: space-between; margin-top: 50px; text-align: center; }
    .ttd div { width: 30%; }
    .card-identitas { max-width: 700px; margin: 20px auto; background: white; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); overflow: hidden; }
    .card-identitas table th { background: #f1f3f5; text-align: right; width: 30%; }
    .card-identitas td { text-align: left; font-weight: 500; }
    .kop-sekolah { text-align: center; font-size: 14px; }
    .kop-sekolah hr { border: 2px solid #000; margin-top: 10px; margin-bottom: 25px; }
    .catatan-box {
      border: 1px solid #000;
      padding: 10px;
      background-color: #fff;
      min-height: 60px;
      font-size: 12pt;
      margin: 10px auto 20px auto;
      width: 90%;
      border-radius: 6px;
      outline: none;
    }
    .catatan-box:empty:before {
      content: attr(data-placeholder);
      color: #888;
      pointer-events: none;
      display: block;
    }
    .catatan-label { font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Tombol atas -->
    <div class="d-flex justify-content-between mb-3">
      <a href="index.html" class="btn btn-secondary">⬅ Kembali</a>
      <button id="btnPdf" class="btn btn-success">⬇ Download PDF</button>
    </div>

    <!-- Kop Sekolah -->
    <div class="kop-sekolah">
      <h2>TAMAN PENDIDIKAN AL QUR'AN<br>“MAFATIHUL HUDA”</h2>
      <p>Desa Bakalanrayung, Kudu, Jombang | Telp. 0857-3634-0726</p>
      <hr>
      <h4><strong>LAPORAN HASIL BELAJAR</strong></h4>
    </div>

    <!-- Kartu Identitas Murid -->
    <div class="card-identitas">
      <table class="table table-bordered table-sm mb-0 align-middle">
        <tbody>
          <tr>
            <th>Nama</th><td id="muridNama"></td>
            <th>NIK</th><td id="muridNIK"></td>
          </tr>
          <tr>
            <th>Nomor Induk</th><td id="muridNoInduk"></td>
            <th>Kelas</th><td id="muridKelas"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Rapor Container -->
    <div id="rapotContainer"></div>

    <!-- Tanda Tangan -->
    <div class="ttd">
      <div>
        <p>Kepala TPQ</p><br><br><br>
        <p>Ani Tuti Aswati M.Pd</p>
      </div>
      <div>
        <p>Wali Murid</p><br><br><br>
        <p id="ttdAyah">___________________</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://wfscxloykjfiqjhizihh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmc2N4bG95a2pmaXFqaGl6aWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNTkyNTAsImV4cCI6MjA3NzgzNTI1MH0.vLBX7NXKVsjyqyVSseLGmrObbGSrzXh-eXbENuKCIx8";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const muridId = params.get("id");

    async function loadRapor() {
      const { data: murid, error: errMurid } = await supabase.from("murid").select("*").eq("id", muridId).single();
      if (errMurid) return alert("Gagal ambil data murid: " + errMurid.message);

      const { data: nilaiList, error: errNilai } = await supabase
        .from("nilai")
        .select("*, mapel:mapel_id(nama, kategori)")
        .eq("murid_id", muridId)
        .order("semester", { ascending: true });

      if (errNilai) return alert("Gagal ambil nilai: " + errNilai.message);

      document.getElementById("muridNama").textContent = murid.nama;
      document.getElementById("muridNIK").textContent = murid.nik || "-";
      document.getElementById("muridNoInduk").textContent = murid.no_induk || "-";
      document.getElementById("muridKelas").textContent = murid.kelas || "-";
      document.getElementById("ttdAyah").textContent = murid.nama_ayah || "___________________";

      const bySemester = {};
      nilaiList.forEach(n => {
        if (!bySemester[n.semester]) bySemester[n.semester] = [];
        bySemester[n.semester].push(n);
      });

      let html = "";
      for (const [semester, daftarNilai] of Object.entries(bySemester)) {
        html += `<h3>Semester ${semester}</h3>`;
        const kategoriList = ["BTQ", "Diniyah", "Praktek"];
        kategoriList.forEach(kat => {
          const perKategori = daftarNilai.filter(n => n.mapel?.kategori === kat);
          html += `<div class="kategori-title">${kat}</div>`;
          html += `<table class="table table-bordered table-sm"><thead><tr><th>Mata Pelajaran</th><th>Nilai</th><th>Deskripsi</th></tr></thead><tbody>`;
          if (perKategori.length > 0) {
            perKategori.forEach(n => {
              html += `<tr>
                <td>${n.mapel?.nama ?? '-'}</td>
                <td>${n.nilai}</td>
                <td>${n.deskripsi ?? ''}</td>
              </tr>`;
            });
          } else {
            html += `<tr><td colspan="3">Belum ada nilai</td></tr>`;
          }
          html += `</tbody></table>`;
        });

        const nilaiAngka = daftarNilai.map(n => n.nilai);
        const rata2 = nilaiAngka.length ? (nilaiAngka.reduce((a, b) => a + b, 0) / nilaiAngka.length).toFixed(2) : 0;
        html += `
          <p class="text-center fw-bold">Rata-rata Semester ${semester}: ${rata2}</p>
          <div class="catatan-box" contenteditable="true" data-placeholder="Catatan Wali Kelas" id="catatan-${semester}">
            ${murid["catatan_semester_" + semester] || ""}
          </div>
          <hr>
        `;
      }

      document.getElementById("rapotContainer").innerHTML = html;
    }

    loadRapor();

    document.getElementById("btnPdf").addEventListener("click", async () => {
      const catatanUpdate = {};
      document.querySelectorAll(".catatan-box").forEach(box => {
        const semester = box.id.split("-")[1];
        catatanUpdate["catatan_semester_" + semester] = box.innerText.trim();
      });

      const { error: errUpdate } = await supabase
        .from("murid")
        .update(catatanUpdate)
        .eq("id", muridId);

      if (errUpdate) return alert("Gagal simpan catatan: " + errUpdate.message);

      html2pdf().set({ margin: 10, filename: `${document.getElementById("muridNama").textContent}_Rapor.pdf` }).from(document.body).save();
    });
  </script>
</body>
</html>
