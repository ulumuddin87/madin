<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Manajemen Mata Pelajaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="mapel.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>📚 Manajemen Mata Pelajaran</h3>
    <div>
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">⬅ Kembali</button>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambah">➕ Tambah Mapel</button>
    </div>
  </div>

  <table class="table table-bordered table-striped" id="tabelMapel">
    <thead class="table-light text-center">
      <tr>
        <th style="width:5%">No</th>
        <th style="width:25%">Nama Mapel</th>
        <th style="width:20%">Kategori</th>
        <th style="width:40%">Deskripsi</th>
        <th style="width:10%">Aksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal Tambah -->
<div class="modal fade" id="modalTambah" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formTambah">
        <div class="modal-header">
          <h5 class="modal-title">➕ Tambah Mapel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nama Mapel</label>
            <input type="text" class="form-control" id="nama" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Kategori</label>
            <input type="text" class="form-control" id="kategori" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Deskripsi</label>
            <textarea class="form-control" id="deskripsi" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">💾 Simpan</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="mapel.js"></script>

</body>
</html>
