<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Mapel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">📚 Daftar Mata Pelajaran</h5>
        <div>
          <a href="index.html" class="btn btn-secondary btn-sm me-2">⬅ Kembali</a>
          <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalMapel">➕ Tambah Mapel</button>
        </div>
      </div>
      <div class="card-body">
        <table class="table table-bordered table-hover" id="tabelMapel">
          <thead class="table-success text-center">
            <tr>
              <th style="width:5%">#</th>
              <th>Nama Mapel</th>
              <th>Kategori</th>
              <th>Deskripsi</th>
              <th style="width:15%">Aksi</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Tambah/Edit Mapel -->
  <div class="modal fade" id="modalMapel" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="modalTitle">Tambah Mapel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formMapel">
          <div class="modal-body">
            <input type="hidden" id="mapelId" />
            <div class="mb-3">
              <label class="form-label">Nama Mapel</label>
              <input type="text" class="form-control" id="nama" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Kategori</label>
              <select id="kategori" class="form-select" required>
                <option value="">-- Pilih Kategori --</option>
                <option>BTQ</option>
                <option>Diniyah</option>
                <option>Praktek</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Deskripsi</label>
              <textarea id="deskripsi" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">💾 Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="mapel.js"></script>
</body>
</html>
