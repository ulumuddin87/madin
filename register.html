<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow">
      <h3 class="text-center mb-3">📝 Registrasi Akun</h3>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Peran (Role)</label>
          <select id="role" class="form-select" required>
            <option value="">Pilih Role</option>
            <option value="admin">Admin</option>
            <option value="guru">Guru</option>
            <option value="kepala">Kepala</option>
          </select>
        </div>
        <div id="kelasField" class="mb-3" style="display:none;">
          <label class="form-label">Kelas (untuk Guru)</label>
          <input type="text" id="kelas" class="form-control">
        </div>
        <button type="submit" class="btn btn-success w-100">Daftar</button>
      </form>
      <p class="text-center mt-3">
        Sudah punya akun? <a href="login.html">Login di sini</a>
      </p>
    </div>
  </div>

  <script type="module" src="register.js"></script>
</body>
</html>
